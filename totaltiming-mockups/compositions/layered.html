<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><title>Layered</title>
<link rel="stylesheet" href="devices.css"></head>
<body style="--canvas-w:1600px;--canvas-h:1126px">
<script type="module">
import { browser, phone, contours, params } from "./devices.js";
// 1219 x 858 aspect: a drop-in candidate for portfolio /showcase-totaltiming.svg.
const transparent = params.get("bg") === "none";
document.body.classList.toggle("transparent", transparent);
if (!transparent) document.body.style.background = "var(--fjord-50)";
document.body.innerHTML = (transparent ? "" : contours({ width: 1600, height: 1126, color: "var(--fjord-100)", count: 16, seed: 5 }))
  + `<div class="abs lift" style="--w:1180px;left:150px;top:56px">${browser({ shot: "admin-shifts", theme: "light", w: 1180 })}</div>`
  + `<div class="abs lift" style="--w:285px;left:36px;top:470px">${phone({ shot: "employee-time", theme: "light", w: 285 })}</div>`
  + `<div class="abs lift-dark" style="--w:300px;left:1268px;top:440px">${phone({ shot: "employee-shifts", theme: "dark", w: 300 })}</div>`;
window.__layout = true;
</script></body></html>
