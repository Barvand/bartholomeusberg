<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><title>Browser</title>
<link rel="stylesheet" href="devices.css"></head>
<body style="--canvas-w:1600px;--canvas-h:1100px;background:var(--fjord-100)">
<script type="module">
import { browser, contours, params } from "./devices.js";
const shot = params.get("shot") ?? "admin-shifts", theme = params.get("theme") ?? "light";
